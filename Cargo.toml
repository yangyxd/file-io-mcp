[package]
name = "file-io-mcp"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 0  # 0=无优化，调试最舒服；1轻微优化，2/3 release级别
debug = true
split-debuginfo = "packed"

[dependencies]
rmcp = { version = "0.16", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
regex = "1"
globset = "0.4"
sha2 = "0.10"
encoding_rs = "0.8"
reqwest = { version = "0.12", features = ["json"] }
axum = "0.8"